<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🚨 Meme Radar</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#070a0f;color:#f4f6f8}
main{max-width:760px;margin:auto;padding:28px 18px 50px}
h1{margin:0 0 4px;font-size:30px}
.sub{color:#9ba5b5;margin:0 0 22px;font-size:16px}
.card{background:#131720;border:1px solid #293140;border-radius:22px;padding:22px}
label{display:block;color:#aeb7c5;font-size:16px;margin-bottom:10px}
input,button{width:100%;border-radius:14px;padding:17px 16px;font-size:16px}
input{background:#0b0e14;color:#fff;border:1px solid #394354}
button{margin-top:12px;border:0;background:#fff;color:#080a0d;font-weight:700;cursor:pointer}
button:disabled{opacity:.55}
.msg{margin-top:14px;color:#9ba5b5;line-height:1.45}
.result{display:none;margin-top:18px}
.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #293140}
.row:last-child{border-bottom:0}
.badge{padding:5px 10px;border-radius:999px;font-weight:700;font-size:13px}
.low{background:#123b26;color:#7df0a5}.medium{background:#4b3b13;color:#ffd76a}.high{background:#4a1e25;color:#ff9aa7}
.flags{margin:14px 0 0;padding-left:20px;color:#c3cad5}
.note{margin-top:18px;color:#7f8a9a;font-size:13px;line-height:1.5}
code{word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>🚨 Meme Radar</h1>
  <p class="sub">Solana meme coin rizikos patikra</p>

  <section class="card">
    <label for="mint">Token mint / CA</label>
    <input id="mint" placeholder="Įklijuok Solana mint adresą">
    <button id="scan">🔎 Scan token</button>
    <div id="msg" class="msg"></div>

    <div id="result" class="result">
      <div class="row"><span>Mint</span><code id="mintOut"></code></div>
      <div class="row"><span>Bendra pasiūla</span><strong id="supply"></strong></div>
      <div class="row"><span>Didžiausia paskyra</span><strong id="top1"></strong></div>
      <div class="row"><span>Top 10 paskyrų</span><strong id="top10"></strong></div>
      <div class="row"><span>Top 20 paskyrų</span><strong id="top20"></strong></div>
      <div class="row"><span>Rizikos lygis</span><span id="risk" class="badge"></span></div>
      <ul id="flags" class="flags"></ul>
    </div>

    <div class="note">
      Tai tik koncentracijos patikra. Ji nepatvirtina, kad tokenas yra saugus ar nesaugus ir nėra investavimo rekomendacija.
    </div>
  </section>
</main>

<script>
const RPCS = [
  "https://solana-rpc.publicnode.com",
  "https://api.mainnet.solana.com"
];

const $ = id => document.getElementById(id);

async function rpc(method, params) {
  let lastErr = null;
  for (const url of RPCS) {
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 9000);
      const r = await fetch(url, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({jsonrpc:"2.0",id:1,method,params}),
        signal:controller.signal
      });
      clearTimeout(timer);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      if (j.error) throw new Error(j.error.message || "RPC error");
      return j.result;
    } catch(e) {
      lastErr = e;
    }
  }
  throw new Error("RPC nepasiekiamas: " + (lastErr?.message || "unknown error"));
}

function pct(x){ return x.toFixed(2) + "%"; }

function setMsg(text){ $("msg").textContent = text; }

async function scan() {
  const mint = $("mint").value.trim();
  $("result").style.display = "none";
  if (!mint) { setMsg("Įklijuok token mint / CA adresą."); return; }

  $("scan").disabled = true;
  setMsg("Tikrinama Solana grandinė…");

  try {
    const supplyRes = await rpc("getTokenSupply",[mint,{"commitment":"confirmed"}]);
    const largestRes = await rpc("getTokenLargestAccounts",[mint,{"commitment":"confirmed"}]);

    const total = Number(supplyRes.value.amount);
    const decimals = supplyRes.value.decimals;
    const accounts = (largestRes.value || []).map(x => Number(x.amount));
    const top1 = accounts[0] || 0;
    const top10 = accounts.slice(0,10).reduce((a,b)=>a+b,0);
    const top20 = accounts.slice(0,20).reduce((a,b)=>a+b,0);

    const p1 = total ? top1/total*100 : 0;
    const p10 = total ? top10/total*100 : 0;
    const p20 = total ? top20/total*100 : 0;

    let level = "LOW", cls = "low", flags = [];

    if (p1 >= 30 || p10 >= 70) {
      level = "HIGH"; cls = "high";
    } else if (p1 >= 15 || p10 >= 45 || p20 >= 60) {
      level = "MEDIUM"; cls = "medium";
    }

    if (p1 >= 30) flags.push("Didelė vienos paskyros koncentracija.");
    if (p10 >= 70) flags.push("Didelė top 10 paskyrų koncentracija.");
    if (p20 >= 60) flags.push("Didelė top 20 paskyrų koncentracija.");
    if (!flags.length) flags.push("Pagal šį rodiklį koncentracija nėra labai didelė.");

    $("mintOut").textContent = mint;
    $("supply").textContent = Number(total / (10 ** decimals)).toLocaleString("en-US") + " tokenų";
    $("top1").textContent = pct(p1);
    $("top10").textContent = pct(p10);
    $("top20").textContent = pct(p20);

    const risk = $("risk");
    risk.textContent = level;
    risk.className = "badge " + cls;

    $("flags").innerHTML = flags.map(x => "<li>"+x+"</li>").join("");
    $("result").style.display = "block";
    setMsg("Patikra baigta.");
  } catch(e) {
    setMsg("Klaida: " + e.message + " Jei matai 403/429, RPC tiekėjas neleidžia užklausos iš šio įrenginio arba viršytas limitas.");
  } finally {
    $("scan").disabled = false;
  }
}

$("scan").addEventListener("click", scan);
$("mint").addEventListener("keydown", e => { if(e.key === "Enter") scan(); });
</script>
</body>
</html>
